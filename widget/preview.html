<!DOCTYPE html>
<html lang="nl">
<head>

    <link rel="stylesheet" href="./assurio-xorder-widget.css">
    <style>
        body {

            background: #f5f7fa;

<script>
window.AssurioXOrderConfig = {
    startDate: '2026-10-15',
    endDate: '2027-01-05',
    targetUrl: '/',
    lang: 'nl',
    position: 'bottom-right',
    dismissDays: 14,
    forceShow: true
